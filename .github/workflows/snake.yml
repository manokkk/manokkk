name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    # 👇 THIS IS THE FIX: Granting permission to push the image to your repo
    permissions: 
      contents: write 
      
    steps:
      - name: Generate Pac-Man Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#FFFF00&color_dots=#161b22,#ffffff,#ffb8ae,#ff9c2a,#ff0000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFFF00&color_dots=#161b22,#ffffff,#ffb8ae,#ff9c2a,#ff0000

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
