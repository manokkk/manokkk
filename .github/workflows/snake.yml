name: Generate Pac-Man Contribution Graph

on:
  schedule:
    # Runs automatically every 24 hours
    - cron: "0 0 * * *"
  
  # Allows you to run this job manually from the Actions tab
  workflow_dispatch:
  
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate Pac-Man Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # PAC-MAN PALETTE: Yellow player, dark background, white/cherry/orange pellets
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#FFFF00&color_dots=#161b22,#ffffff,#ffb8ae,#ff9c2a,#ff0000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFFF00&color_dots=#161b22,#ffffff,#ffb8ae,#ff9c2a,#ff0000

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
