name: Generate Radical Neon Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions: 
      contents: write 
      
    steps:
      - name: Generate Neon Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # RADICAL PALETTE: Dark background, bright pink snake, cyan/purple/pink gradient dots
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#fe428e&color_dots=#141321,#a9fef7,#2bdfc1,#a020f0,#fe428e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fe428e&color_dots=#141321,#a9fef7,#2bdfc1,#a020f0,#fe428e

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
